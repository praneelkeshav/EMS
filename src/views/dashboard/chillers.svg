<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 500 200"
  width="400px"
  height="200px"
>
  <!-- Chiller body -->
  <rect x="50" y="60" width="300" height="100" rx="10" ry="10" fill="#1E90FF" />
  
  <!-- Compressor -->
  <rect x="310" y="70" width="80" height="60" rx="10" ry="10" fill="black" />

  <!-- Input and Output Lines -->
  <line x1="50" y1="100" x2="0" y2="100" stroke="green" stroke-width="6" />
  <line x1="350" y1="100" x2="400" y2="100" stroke="red" stroke-width="6" />
  
  <!-- Temperature indicators -->
  <text x="10" y="95" font-size="16" fill="black">In: 12°C</text>
  <text x="410" y="105" font-size="16" fill="black">Out: 6°C</text>

  <!-- COP box -->
  <rect x="150" y="40" width="100" height="40" rx="8" ry="8" fill="#ADD8E6" />
  <text x="160" y="65" font-size="18" font-weight="bold" fill="black">COP: 2.5</text>
</svg>
